[package]
name = "rexit"
version = "2.1.0"
edition = "2021"
description = "Export your Reddit Chats"
readme = "README.md"
license = "GPL-3.0"
repository = "https://github.com/MPult/Rexit"
keywords = ["reddit", "export", "chat", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "test_resources/", "justfile", ".DS_Store"]

[dependencies]
cached = { version = "4", features = ["async"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dotenvy = "0.15"
html-escape = "0.2.13"
inquire = "0.9"
log = "0.4"
log4rs = { version = "1.4", default-features = false, features = ["console_appender", "file_appender", "threshold_filter", "pattern_encoder"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "http2", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.47", features = ["full"] }
url = "2.5"
urlencoding = "2.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
