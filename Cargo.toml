[package]
name = "rexit"
version = "2.1.0"
edition = "2021"
description = "Export your Reddit Chats"
readme = "README.md"
license = "GPL-3.0"
repository = "https://github.com/MPult/Rexit"
keywords = ["reddit", "export", "chat", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "test_resources/", "justfile", ".DS_Store"]

[dependencies]
cached = "0.43.*"
chrono = { version = "0.4.*", features = ["serde"] }
clap = { version = "4.3.*", features = ["derive"] }
dotenvy = "0.15"
console = { version = "0.15.*", features = ["windows-console-colors"] }
html-escape = "0.2.13"
inquire = "0.6.*"
log = "0.4.*"
log4rs = "1.2.0"
pretty_env_logger = "0.5.*"
regex = "1.7.3"
reqwest = { version = "0.11.*", default-features = false, features = ["blocking", "multipart", "cookies", "gzip", "rustls-tls"] }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.28.1", features = ["full"] }
url = "2.4.*"
urlencoding = "2.1.*"

[profile.release]
strip = true
lto = true
codegen-units = 1
